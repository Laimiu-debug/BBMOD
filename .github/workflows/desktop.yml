name: Windows desktop checks
on:
  push:
    paths: ['app/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r app/requirements.txt
      - name: MOD files, recovery, UI and update regressions
        run: python -X utf8 app/tools/run_desktop_tests.py
