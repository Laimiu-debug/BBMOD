name: bbmod-hub
services:
  app:
    image: bbmod-hub:0.3.1
    build:
      context: ..
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      BBMOD_DATA_DIR: /srv/data
      BBMOD_HTTPS: '1'
      BBMOD_TRUST_PROXY: '1'
      BBMOD_DESKTOP_DOWNLOAD_ROOT: /srv/desktop
      BBMOD_DESKTOP_DOWNLOAD_ACCEL: '1'
    volumes:
      - bbmod_data:/srv/data
      - bbmod_desktop:/srv/desktop
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto':'https'}))"]
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - bbmod_desktop:/srv/desktop:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      backend:
      edge:
        aliases: [bbmod_hub_gateway]
    restart: unless-stopped
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
networks:
  backend:
  edge:
    external: true
    name: ${BBMOD_EDGE_NETWORK:?Set the existing HTTPS proxy Docker network}
volumes:
  bbmod_data:
  bbmod_desktop:
