# Include only inside the origin's existing HTTPS server block.
# The public site is at bbmod.vercel.app; this prefix is for Vercel rewrites.
location ^~ /bbmod-origin/ {
    client_max_body_size 308m;
    client_body_timeout 120s;
    set $bbmod_gateway bbmod_hub_gateway;
    rewrite ^/bbmod-origin/(.*)$ /$1 break;
    proxy_pass http://$bbmod_gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host bbmod.vercel.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_read_timeout 185s;
    proxy_send_timeout 185s;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_redirect off;
}
