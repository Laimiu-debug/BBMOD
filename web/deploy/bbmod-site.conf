# Include at the top level of the existing HTTPS proxy configuration.
server {
    listen 80;
    server_name bbmod.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://bbmod.site$request_uri;
    }
}

server {
    listen 443 ssl;
    # Use HTTP/1.1 for reliable large browser uploads on this site's current route.
    http2 off;
    server_name bbmod.site;
    ssl_certificate /etc/letsencrypt/live/bbmod.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbmod.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 308m;
    client_body_timeout 120s;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $bbmod_gateway bbmod_hub_gateway;
        proxy_pass http://$bbmod_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host bbmod.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 185s;
        proxy_send_timeout 185s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_redirect off;
    }
}
