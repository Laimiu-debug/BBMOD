name: bbmod-candidate
services:
  app:
    image: bbmod-hub:cloudcone-20261002
    env_file: .env
    environment:
      BBMOD_DATA_DIR: /srv/data
      BBMOD_HTTPS: '1'
      BBMOD_TRUST_PROXY: '1'
      BBMOD_DESKTOP_DOWNLOAD_ROOT: /srv/desktop
      BBMOD_DESKTOP_DOWNLOAD_ACCEL: '1'
      BBMOD_MOD_DOWNLOAD_ACCEL: '1'
    volumes:
      - ./data:/srv/data
      - ./desktop:/srv/desktop
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto':'https'}))"]
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports: ['127.0.0.1:18080:8080']
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./desktop:/srv/desktop:ro
      - ./data:/srv/data:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend, edge]
    restart: unless-stopped
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
networks:
  backend:
    internal: true
  edge: {}
