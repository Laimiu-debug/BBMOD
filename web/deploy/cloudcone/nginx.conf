# Install after bbmod.com registration, DNS and valid certificate issuance.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
events { worker_connections 2048; }

stream {
    map $ssl_preread_server_name $bbmod_backend {
        bbmod.com 127.0.0.1:8443;
        www.bbmod.com 127.0.0.1:8443;
        default 127.0.0.1:10443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $bbmod_backend;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/nginx/bbmod-access.log;
    error_log /var/log/nginx/bbmod-error.log;

    server {
        listen 80;
        listen [::]:80;
        server_name bbmod.com www.bbmod.com;
        location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://bbmod.com$request_uri; }
    }
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        server_name bbmod.com www.bbmod.com;
        ssl_certificate /etc/letsencrypt/live/bbmod.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bbmod.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        client_max_body_size 308m;
        client_body_timeout 120s;
        if ($host = www.bbmod.com) { return 301 https://bbmod.com$request_uri; }
        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host bbmod.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host "";
            proxy_read_timeout 185s;
            proxy_send_timeout 185s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_redirect off;
        }
    }
}
