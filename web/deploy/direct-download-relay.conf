# Read-only transport on the independent existing server (dl.gongpro.app).
# Include in host Nginx http context; route its TLS SNI to 127.0.0.1:19443.
server {
    listen 80;
    listen [::]:80;
    server_name dl.gongpro.app;
    location ^~ /.well-known/acme-challenge/ { root /srv/gongpro-data/certbot/www; }
    location / { return 308 https://dl.gongpro.app$request_uri; }
}
server {
    listen 127.0.0.1:19443 ssl;
    server_name dl.gongpro.app;
    ssl_certificate /srv/gongpro-data/certbot/conf/live/dl.gongpro.app/fullchain.pem;
    ssl_certificate_key /srv/gongpro-data/certbot/conf/live/dl.gongpro.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/bbmod-relay-access.log;
    error_log /var/log/nginx/bbmod-relay-error.log warn;

    location = /bbmod/ {
        root /srv/bbmod-download-relay;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/bbmod(?<bbmod_path>/(?:downloads/windows/(?:[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}/)?|files/[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}/download/|mods/[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}/|api/v1/(?:desktop/releases/|catalog/|(?:profiles|saves)/[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}/(?:files/[a-f0-9]{64}/)?)))$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($args != "") { return 400; }
        proxy_pass https://113.20.0.234$bbmod_path;
        proxy_ssl_server_name on;
        proxy_ssl_name bbmod.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host bbmod.com;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding "";
        proxy_pass_request_body off;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Accel-Redirect;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        add_header X-BBMOD-Route direct-relay always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
