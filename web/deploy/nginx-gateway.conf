# Private Docker listener behind the existing HTTPS origin.
# No host ports are published by compose.gateway.yml.
server {
    listen 8080;
    server_name _;
    client_max_body_size 308m;
    client_body_timeout 120s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /_desktop/ {
        internal;
        alias /srv/desktop/;
        default_type application/octet-stream;
        sendfile on;
        max_ranges 1;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Checksum-SHA256 $upstream_http_x_checksum_sha256 always;
    }
    location / {
        set $bbmod_app app;
        proxy_pass http://$bbmod_app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 185s;
        proxy_send_timeout 185s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
}
