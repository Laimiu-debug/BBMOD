server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/bbmod-certs/fullchain.pem;
    ssl_certificate_key /etc/bbmod-certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 308m;
    client_body_timeout 120s;
    location /_desktop/ {
        internal;
        alias /srv/desktop/;
        default_type application/octet-stream;
        sendfile on;
        max_ranges 1;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Checksum-SHA256 $upstream_http_x_checksum_sha256 always;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 185s;
        proxy_buffering off;
    }
}
