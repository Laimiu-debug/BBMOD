<section class="panel"><h2>网站访客</h2><dl class="traffic-grid"><div><dt>累计访客</dt><dd>{{ traffic.total }}</dd></div><div><dt>今日访客</dt><dd>{{ traffic.today }}</dd></div><div><dt>今日新访客</dt><dd>{{ traffic.new_today }}</dd></div><div><dt>累计浏览次数</dt><dd>{{ traffic.page_views }}</dd></div></dl><p class="help">{% if traffic.since %}从 {{ traffic.since|date:'Y.m.d H:i' }} 开始记录。{% else %}等待第一位访客。{% endif %}同一浏览器重复访问不增加累计访客，但会增加浏览次数。清除站点数据、换浏览器或换设备会算作新访客；关闭 JavaScript 时不计数。统计不保存 IP 地址和浏览轨迹。</p></section>
