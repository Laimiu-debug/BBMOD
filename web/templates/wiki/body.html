<div class="wiki-bodies{% if entry.parallel %} wiki-parallel{% endif %}">{% for reading in entry.readings %}<section class="wiki-reading-pane{% if reading.source %} wiki-source{% endif %}" id="{{ reading.id }}" lang="{{ reading.language }}">{% if entry.parallel %}<h2 class="wiki-pane-label">{{ reading.label }}</h2>{% endif %}<div class="wiki-content">{{ reading.content }}</div></section>{% endfor %}</div>
